# Continuous Integration workflow for zen-octo
# Runs on pushes to main and non-draft pull requests

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is required so marking a draft PR ready triggers a run;
    # the default types (opened, synchronize, reopened) don't fire on that
    # transition. Draft PRs still emit these events — the job-level `if` below
    # is what actually skips them.
    types: [opened, synchronize, reopened, ready_for_review]
    # No branch filter. A PR onto a stacked branch would otherwise trigger
    # nothing, and required checks that never ran report as satisfied rather
    # than as missing.
  # Asking for a run by hand, because a head can end up with no CI and no way
  # to request one. Merging a stacked PR into its parent moves the parent's
  # head without GitHub emitting a `synchronize` for the parent, and closing
  # and reopening it does not fire `reopened` either: the PR then reports the
  # checks that do run on a push as though they were the whole suite, which is
  # the same failure the types above were written to prevent, reached by a
  # route they do not cover.
  #
  # This is the way out that does not involve an empty commit. Every job below
  # gates on `github.event_name != 'pull_request'`, so a dispatched run behaves
  # like a push and runs everything.
  workflow_dispatch:

concurrency:
  # The action is part of the key so a `ready_for_review` run can't be cancelled
  # by a `synchronize` run that raced it. Pushing and marking ready in one go
  # sends both at once: synchronize still carries `draft: true`, so its jobs
  # skip, and if it also cancelled the ready run the PR ended up with no CI at
  # all while reporting only skipped checks.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  lint:
    name: Lint + Format
    # Skip while the PR is a draft; push events (main) have no PR object and
    # always run. Marking the PR ready (ready_for_review) re-fires CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep this matching the local brew version, or local runs and CI
          # stop agreeing about what passes.
          version: v2.12.2

      - name: Run actionlint
        run: make lint-actions

  # Not a matrix: that renames the required "Test" check, and every PR then waits on one that never reports.
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

  test-windows:
    name: Test (windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v ./cmd/zen-octo

  # Installs the published release, not this branch: the download, checksum and move are what's under test.
  install-script:
    name: Install script (${{ matrix.shell }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Resolved with a token because runners share the anonymous API rate limit.
      - name: Resolve the release to install
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo ${{ github.repository }} --json tagName --jq .tagName
          if (-not $tag) { throw "could not resolve a published release to install" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # shell: takes no matrix context, so the shell under test runs as a child of the default one.
      - name: Install the latest release
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1

      - name: Check it runs and reports a released version
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zen-octo\zen-octo.exe'
          if (-not (Test-Path $exe)) { throw "the installer left no binary at $exe" }
          $reported = & $exe --version
          Write-Host $reported
          if ($reported -match 'zen-octo version dev') { throw "installed binary reports dev: $reported" }
          if ($reported -notmatch 'zen-octo version \d+\.\d+\.\d+') { throw "unexpected version line: $reported" }

      # Piped the way the docs say to run it, and over the first install, which is the upgrade Windows makes awkward.
      - name: Install again, the way the docs say to run it
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: ${{ matrix.shell }} -NoProfile -Command "Get-Content ./install.ps1 -Raw | Invoke-Expression"
